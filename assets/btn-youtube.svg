<svg xmlns="http://www.w3.org/2000/svg" width="169" height="56" viewBox="0 0 169 56" role="img" aria-label="YouTube"><title>YouTube</title><style>.wob,.bob,.roll,.spin{transform-box:fill-box;transform-origin:center}.wob{animation:wob 3.4s ease-in-out infinite}@keyframes wob{0%,100%{transform:none}30%{transform:rotate(-6deg) scale(.97)}70%{transform:rotate(5deg) scale(1.03)}}.bob{animation:bob 3.2s ease-in-out infinite}@keyframes bob{0%,100%{transform:none}50%{transform:translate(0,-10px) rotate(-4deg)}}.roll{animation:roll 2.6s ease-in-out infinite}@keyframes roll{0%,100%{transform:none}33%{transform:rotate(-12deg)}66%{transform:translate(0,-8px) rotate(10deg)}}.spin{animation:spin 14s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.blink{animation:blink 1.1s steps(2) infinite}@keyframes blink{50%{opacity:.25}}.pulse,.slam,.fly{transform-box:fill-box;transform-origin:center}.pulse{animation:pulse 1.6s ease-in-out infinite}@keyframes pulse{0%,100%{transform:none}50%{transform:scale(1.05) rotate(3deg)}}.fly{animation:fly 2.4s ease-in-out infinite}@keyframes fly{0%,100%{transform:none}50%{transform:translate(14px,-12px) rotate(-6deg)}}.slam{animation:slam .5s cubic-bezier(.2,.9,.3,1.25) .15s 1}@keyframes slam{0%{transform:none}1%{transform:scale(1.35) rotate(-5deg)}55%{transform:scale(.95)}100%{transform:none}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><filter id="popdrop" x="-20%" y="-20%" width="150%" height="150%"><feDropShadow dx="5" dy="7" stdDeviation="0" flood-color="#140d1f" flood-opacity=".55"/></filter></defs><polygon points="14.2,9 165.8,9 159.6,53 8,53" fill="#140d1f"/><polygon points="9.2,3 160.8,3 154.6,47 3,47" fill="#fff3d6" stroke="#140d1f" stroke-width="4" stroke-linejoin="round"/><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.5