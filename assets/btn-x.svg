<svg xmlns="http://www.w3.org/2000/svg" width="101" height="56" viewBox="0 0 101 56" role="img" aria-label="X"><title>X</title><style>.wob,.bob,.roll,.spin{transform-box:fill-box;transform-origin:center}.wob{animation:wob 3.4s ease-in-out infinite}@keyframes wob{0%,100%{transform:none}30%{transform:rotate(-6deg) scale(.97)}70%{transform:rotate(5deg) scale(1.03)}}.bob{animation:bob 3.2s ease-in-out infinite}@keyframes bob{0%,100%{transform:none}50%{transform:translate(0,-10px) rotate(-4deg)}}.roll{animation:roll 2.6s ease-in-out infinite}@keyframes roll{0%,100%{transform:none}33%{transform:rotate(-12deg)}66%{transform:translate(0,-8px) rotate(10deg)}}.spin{animation:spin 14s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.blink{animation:blink 1.1s steps(2) infinite}@keyframes blink{50%{opacity:.25}}.pulse,.slam,.fly{transform-box:fill-box;transform-origin:center}.pulse{animation:pulse 1.6s ease-in-out infinite}@keyframes pulse{0%,100%{transform:none}50%{transform:scale(1.05) rotate(3deg)}}.fly{animation:fly 2.4s ease-in-out infinite}@keyframes fly{0%,100%{transform:none}50%{transform:translate(14px,-12px) rotate(-6deg)}}.slam{animation:slam .5s cubic-bezier(.2,.9,.3,1.25) .15s 1}@keyframes slam{0%{transform:none}1%{transform:scale(1.35) rotate(-5deg)}55%{transform:scale(.95)}100%{transform:none}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><filter id="popdrop" x="-20%" y="-20%" width="150%" height="150%"><feDropShadow dx="5" dy="7" stdDeviation="0" flood-color="#140d1f" flood-opacity=".55"/></filter></defs><polygon points="14.2,9 97.5,9 91.4,53 8,53" fill="#140d1f"/><polygon points="9.2,3 92.5,3 86.4,47 3,47" fill="#fff3d6" stroke="#140d1f" stroke-width="4" stroke-linejoin="round"/><path d="M14.234 10.162 22.977 0h-2.072l-7.591 8.824L7.251 0H.258l9.168 13.343L.258 24H2.33l8.016-9.318L16.749 24h6.993zm-2.837 3.299-.929-1.329L3.076 1.56h3.182l5.965 8.532.929 1.329 7.754 11.09h-3.182z" transform="translate(26.8 15.5) sc